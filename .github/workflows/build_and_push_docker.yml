name: ci

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dockerfile_path:
        description: 'Path to the Dockerfile'
        required: true
        type: choice
        options:
          - ./app/backend/pikeberry/Dockerfile
          - ./app/backend/deployment/Dockerfile
        default: ./Dockerfile
      docker_tag:
        description: 'Docker image tag (e.g., latest, v1.0.0)'
        required: true
        type: string
        default: latest
      push_image:
        description: 'Push the image to the registry?'
        type: boolean
        required: true
        default: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ github.workspace }}
          file: ${{ inputs.dockerfile_path }}
          push: ${{ inputs.push_image }}
          tags: ${{ vars.DOCKERHUB_USERNAME }}/app:${{ inputs.docker_tag }}
          build-args: |
            # Add any build arguments here if needed
            # Example: APP_VERSION=${{ inputs.docker_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output Image Digest
        if: ${{ steps.build-push.outputs.digest != '' }}
        run: |
            echo "Image Digest: ${{ steps.build-push.outputs.digest }}"

      - name: Output Image ID
        if: ${{ steps.build-push.outputs.imageid != '' }}
        run: |
            echo "Image ID: ${{ steps.build-push.outputs.imageid }}"
